name: IgaraUI Guard

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/igaraui-guard.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'

jobs:
  frontend-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
