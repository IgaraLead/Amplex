# ============================================================
#  Amplex – Docker Compose (Production)
# ============================================================
#  Imagem full-stack: FastAPI serve API + frontend estático.
#  Conecta ao postgres da stack Infra via rede igaralead_public.
#  A stack Infra (docker-compose.core.yml ou full.yml) deve estar rodando.
#
#  Uso:
#    cp .env.example .env && vi .env
#    docker compose -f docker-compose.production.yml up -d
# ============================================================

services:
  amplex:
    image: ghcr.io/${GHCR_OWNER}/amplex:latest
    container_name: amplex
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
    networks:
      - igaralead_public

networks:
  igaralead_public:
    external: true
