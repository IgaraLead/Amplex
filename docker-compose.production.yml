# ============================================================
#  Amplex – Docker Compose (Production)  —  VPS 1
# ============================================================
#  Imagem full-stack: Django (API + frontend estático via WhiteNoise).
#  Conecta ao postgres, redis e minio da stack Infra via rede
#  igaralead_public. A stack Infra (docker-compose.core.yml)
#  deve estar rodando.
#
#  Uso (Portainer):
#    Deploy stack via Portainer → variáveis em stack.env
#  Uso (CLI):
#    cp .env.example stack.env && vi stack.env
#    docker compose -f docker-compose.production.yml up -d
# ============================================================

services:
  amplex:
    image: ghcr.io/${GHCR_OWNER:-igaralead}/amplex:latest
    container_name: amplex
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "8002:8000"
    env_file:
      - path: stack.env
        required: false
    environment:
      ENVIRONMENT: production
      AMPLEX_ADMIN_EMAIL: ${AMPLEX_ADMIN_EMAIL:-admin@dev.local}
      AMPLEX_ADMIN_PASSWORD: ${AMPLEX_ADMIN_PASSWORD:-admin123}
      AMPLEX_ADMIN_NAME: ${AMPLEX_ADMIN_NAME:-Admin}
      AMPLEX_DEFAULT_ORG_NAME: ${AMPLEX_DEFAULT_ORG_NAME:-Dev Org}
      AMPLEX_DEFAULT_ORG_SLUG: ${AMPLEX_DEFAULT_ORG_SLUG:-dev}
    networks:
      - igaralead_public

networks:
  igaralead_public:
    external: true
