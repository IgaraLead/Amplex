# ============================================================
#  Amplex – Docker Compose (Dev)
# ============================================================
#  Conecta ao Infra (igaralead_public) para postgres + redis.
#  Inicie o Infra e Hub antes:
#    cd ../Infra && docker compose -f docker-compose.core.yml up -d
#    cd ../Hub   && docker compose up -d
#
#  Uso:
#    docker compose up -d
# ============================================================

services:
  amplex-backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "8002:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Database (Infra postgres — unified igaralead DB)
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: igaralead
      # Redis (Infra redis)
      REDIS_URL: redis://:redis@redis:6379/0
      # Hub integration (server-to-server via Docker network)
      HUB_URL: http://hub-backend:8000
      HUB_API_KEY: dev-hub-api-key
      # CORS (frontend dev server)
      AMPLEX_CORS_ORIGINS: http://localhost:3003
      FRONTEND_URL: http://localhost:3003
    volumes:
      - ./api:/app/api
      - ./amplex:/app/amplex
      - ./manage.py:/app/manage.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/amplex/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - igaralead_public

  amplex-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - amplex_frontend_node_modules:/app/node_modules
    ports:
      - "3003:3003"
    environment:
      API_URL: http://amplex-backend:8000
    depends_on:
      - amplex-backend
    networks:
      - igaralead_public

volumes:
  amplex_frontend_node_modules:

networks:
  igaralead_public:
    external: true
