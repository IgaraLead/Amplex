# ============================================================
#  Amplex — Docker Compose (Dev)
# ============================================================
#  Espera rede externa com Postgres + Redis (ex.: Infra stack).
#  Crie a BD `amplex` no Postgres antes do primeiro `up`.
#
#    docker compose up -d --build
# ============================================================

services:
  amplex-backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "8002:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      SECRET_KEY_BASE: dev-not-for-production-use-change-me-please-12345
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: amplex
      REDIS_URL: redis://:redis@redis:6379/0
      AMPLEX_ADMIN_EMAIL: admin@dev.local
      AMPLEX_ADMIN_PASSWORD: admin123
      AMPLEX_ADMIN_NAME: Admin
      AMPLEX_DEFAULT_ORG_NAME: Dev Org
      AMPLEX_DEFAULT_ORG_SLUG: dev
      AMPLEX_CORS_ORIGINS: http://localhost:3003
      FRONTEND_URL: http://localhost:3003
    volumes:
      - ./api:/app/api
      - ./amplex:/app/amplex
      - ./manage.py:/app/manage.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/amplex/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - igaralead_public

  amplex-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - amplex_web_node_modules:/app/node_modules
    ports:
      - "3003:3003"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - amplex-backend
    networks:
      - igaralead_public

volumes:
  amplex_web_node_modules:

networks:
  igaralead_public:
    external: true
